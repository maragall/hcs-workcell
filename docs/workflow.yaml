# The setup workflow as `python cli.py setup` runs it (2026-10-29). Arm sections start without a prompt (Ctrl+C stops);
# camera-gate doubts are answered yes and logged to runs/mismatches.log.

# Prereqs
user : place squid on the indicated region (base 25 cm or more from the polar base)
user : connect squid
user : connect polar   # robot
user : connect nova    # vision
user : place a plate on the rotation module

# Connect system modules
connect:
    - computer : search ports   # connects to nova, polar, and squid
    - squid : home stage
    - polar : arm to nest
    - polar : rotation module to 0 deg
    - polar : hover hand onto rotation module centroid

# Set initial state parameters
cameras.toml:
    - nova : detect aruco with the down camera
    - polar : centre the camera over the tag
    - polar : drive the capture plan   # -> pictures, captured_at
    - computer : solve intrinsic and extrinsic calibration together   # -> error_px, error_mm
    - computer : refuse if px > 5.0 or mm > 2.0
    - computer : re-upload to nova, which restarts   # -> uploaded_at; login from nova_ssh.local.json (git-ignored); old files kept as .bak

# Teach the microscope seat
swap:
    - user : set a plate flat in the microscope holder; drag the hand so the open fingers straddle it, claw square
    - computer : take that pose as the seat   # hover = seat + hover_mm, yaw from the hand
    - polar : release the plate, rise straight out
    - polar : prove the seat; pick the plate, lift, set it back, release
    - user : place a real plate on the rotation module

grips.toml:
    - polar : grip the short edges at the module pose, close until stall   # -> short_closed
    - computer : choose long-edge grip offset for the hotel size   # -> grip_offset (0 in a 15-slot hotel: grip at the middle)
    - polar : rotate module to 90, grip the long edges, close until stall   # -> long_closed
    - computer : accept band around each closed width   # -> accept_band, measured_at
    - polar : carry, seat and re-grip   # the width stays in the band
    - polar : place plate back on the module at 0 deg

microscope.toml:
    - computer : read stage travel limits from squid   # -> stage_sweep_box, park_xy, park_tolerance

# Clear the stage
user : remove the plate from the microscope stage

system_state.json:
    - computer : occupancy per slot   # -> contents[slot]; by hand for the demo
    - polar : look at the module and gripper
    - computer : detect plate or empty   # -> contents[location]

# Test: the rotation, for ever
test:
    - polar : module plate to the microscope, acquire, into an empty taught slot
    - polar : each plate in a taught slot to the microscope, acquire, into the slot empty the longest
    - computer : repeat until runs/STOP   # camera-gate doubts are logged to runs/mismatches.log
